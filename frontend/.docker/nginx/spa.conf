server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy para a API e autenticação Sanctum.
    # Replica o comportamento do Vite dev proxy — o browser só fala com esta
    # origin, eliminando CORS e a necessidade de NUXT_PUBLIC_API_URL em prod.
    location ~ ^/(api|sanctum)/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://nginx:80;
        proxy_pass $backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback — todas as rotas vão para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker sem cache (PWA)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Manifest PWA sem cache
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        expires 0;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
