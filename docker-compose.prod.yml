x-app-env: &app-env
  APP_NAME: ${APP_NAME:-BolãoCopa}
  APP_ENV: production
  APP_KEY: ${APP_KEY}
  APP_DEBUG: "false"
  APP_URL: https://${DOMAIN}
  LOG_CHANNEL: stderr
  LOG_LEVEL: error
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: bolao
  DB_USERNAME: bolao
  DB_PASSWORD: ${DB_PASSWORD}
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_PORT: "6379"
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  SESSION_LIFETIME: "120"
  SANCTUM_STATEFUL_DOMAINS: ${DOMAIN}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
  FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY}
  FOOTBALL_DATA_COMPETITION: ${FOOTBALL_DATA_COMPETITION:-WC}
  VAPID_SUBJECT: ${VAPID_SUBJECT}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}

services:

  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: bolao_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bolao
      POSTGRES_USER: bolao
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=16MB
      -c max_connections=150
      -c random_page_cost=1.1
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bolao_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bolao -d bolao"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Backend Laravel (Supervisor: php-fpm + scheduler) ───────────────────────
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bolao_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      <<: *app-env
    command: supervisord -c /etc/supervisor/conf.d/supervisord.conf
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bolao_network
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t 2>&1 | grep -q 'successful'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─── Laravel Horizon ─────────────────────────────────────────────────────────
  horizon:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bolao_horizon
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      <<: *app-env
    command: php artisan horizon
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bolao_network

  # ─── Nginx backend (interno — não exposto ao Traefik) ─────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: bolao_nginx
    restart: unless-stopped
    volumes:
      - ./backend/public:/var/www/html/public:ro
      - ./backend/.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - bolao_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Frontend Nuxt — exposto via Traefik (Coolify) ───────────────────────────
  # O nginx do frontend proxia /api e /sanctum para o serviço `nginx` (backend)
  # via rede interna Docker. NUXT_PUBLIC_API_URL fica vazio (URLs relativas).
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    container_name: bolao_frontend
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - bolao_network
      - coolify
    labels:
      - traefik.enable=true
      - traefik.http.routers.bolao-frontend.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.bolao-frontend.entrypoints=https
      - traefik.http.routers.bolao-frontend.tls.certresolver=letsencrypt
      - traefik.http.services.bolao-frontend.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bolao_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    networks:
      - bolao_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  bolao_network:
    driver: bridge
  coolify:
    external: true

volumes:
  postgres_data:
  redis_data:
