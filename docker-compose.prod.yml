x-app-env: &app-env
  APP_NAME: '${APP_NAME:-BolãoCopa}'
  APP_ENV: '${APP_ENV:-production}'
  APP_KEY: '${APP_KEY}'
  APP_DEBUG: '${APP_DEBUG:-"false"}'
  APP_URL: 'https://${DOMAIN}'
  FRONTEND_URL: '${FRONTEND_URL:-https://${DOMAIN}}'
  LOG_CHANNEL: '${LOG_CHANNEL:-stderr}'
  LOG_LEVEL: '${LOG_LEVEL:-error}'
  DB_CONNECTION: '${DB_CONNECTION:-pgsql}'
  DB_HOST: '${DB_HOST:-postgres}'
  DB_PORT: '${DB_PORT:-5432}'
  DB_DATABASE: '${DB_DATABASE:-bolao}'
  DB_USERNAME: '${DB_USERNAME:-bolao}'
  DB_PASSWORD: '${DB_PASSWORD}'
  REDIS_HOST: '${REDIS_HOST:-redis}'
  REDIS_PASSWORD: '${REDIS_PASSWORD}'
  REDIS_PORT: '${REDIS_PORT:-6379}'
  CACHE_STORE: '${CACHE_STORE:-redis}'
  QUEUE_CONNECTION: '${QUEUE_CONNECTION:-redis}'
  SESSION_DRIVER: '${SESSION_DRIVER:-redis}'
  SESSION_LIFETIME: '${SESSION_LIFETIME:-120}'
  SANCTUM_STATEFUL_DOMAINS: '${DOMAIN}'
  GOOGLE_CLIENT_ID: '${GOOGLE_CLIENT_ID}'
  GOOGLE_CLIENT_SECRET: '${GOOGLE_CLIENT_SECRET}'
  GOOGLE_REDIRECT_URI: '${GOOGLE_REDIRECT_URI}'
  FOOTBALL_DATA_API_KEY: '${FOOTBALL_DATA_API_KEY}'
  FOOTBALL_DATA_COMPETITION: '${FOOTBALL_DATA_COMPETITION:-WC}'
  VAPID_SUBJECT: '${VAPID_SUBJECT}'
  VAPID_PUBLIC_KEY: '${VAPID_PUBLIC_KEY}'
  VAPID_PRIVATE_KEY: '${VAPID_PRIVATE_KEY}'
  AI_RANKING_ENABLED: '${AI_RANKING_ENABLED:-false}'
  GEMINI_API_KEY: '${GEMINI_API_KEY}'
  GEMINI_MODEL: '${GEMINI_MODEL:-gemini-2.5-flash-lite}'
  GEMINI_MAX_OUTPUT_TOKENS: '${GEMINI_MAX_OUTPUT_TOKENS:-64}'
  GEMINI_TEMPERATURE: '${GEMINI_TEMPERATURE:-0.55}'
  BULLETIN_PROMPT_VERSION: '${BULLETIN_PROMPT_VERSION:-3}'
  AI_RANKING_DAILY_BUDGET: '${AI_RANKING_DAILY_BUDGET:-0}'

services:

  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    container_name: bolao_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: '${DB_DATABASE:-bolao}'
      POSTGRES_USER: '${DB_USERNAME:-bolao}'
      POSTGRES_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - bolao_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-bolao} -d ${DB_DATABASE:-bolao}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bolao_network

  # --- Redis ---
  redis:
    image: redis:7-alpine
    container_name: bolao_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - bolao_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bolao_network

  # --- App (PHP-FPM) ---
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bolao_app
    restart: unless-stopped
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bolao_network

  # --- Horizon (Queue Worker) ---
  horizon:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bolao_horizon
    restart: unless-stopped
    command: ["php", "artisan", "horizon"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bolao_network

  # --- Scheduler (schedule:work — SyncMatchResults a cada 1 min) ---
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bolao_scheduler
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bolao_network

  # --- Nginx (proxy interno -> PHP-FPM) ---
  nginx:
    build:
      context: ./backend/.docker/nginx
      dockerfile: Dockerfile
    container_name: bolao_nginx
    restart: unless-stopped
    depends_on:
      - app
    networks:
      - bolao_network

  # --- Frontend (SPA Nuxt + Traefik) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
      args:
        NUXT_PUBLIC_VAPID_PUBLIC_KEY: '${VAPID_PUBLIC_KEY}'
    container_name: bolao_frontend
    restart: unless-stopped
    depends_on:
      - nginx
    networks:
      - bolao_network
      - coolify
    labels:
      traefik.enable: "true"
      traefik.http.routers.bolao-frontend.rule: Host(`bolaodacopa.werlesson.dev`)
      traefik.http.routers.bolao-frontend.entrypoints: https
      traefik.http.routers.bolao-frontend.tls: "true"
      traefik.http.routers.bolao-frontend.tls.certresolver: letsencrypt
      traefik.http.services.bolao-frontend.loadbalancer.server.port: "80"

volumes:
  bolao_postgres_data:
  bolao_redis_data:
networks:
  bolao_network:
    driver: bridge
  coolify:
    external: true
